// The root project only coordinates. Shared sources live in src/, and each supported Minecraft
// version is a module under versions/ that adds its own implementations (see CONTRIBUTING.md).
plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.24' apply false
}
