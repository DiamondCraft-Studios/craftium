// Shared build logic for the Paper/Purpur companion plugin. A version module sets
//   ext { paperDevBundle = '<dev bundle>'; minecraftVersion = '<mc version>'; pluginJava = <n> }
// and its `version`, then applies this file. Shared plugin code lives in server-plugin/src; the module
// adds its own plugin.yml. The version's compat layer comes from versions/<mc>/src/main/java.
apply plugin: 'java'
apply plugin: 'io.papermc.paperweight.userdev'

group = 'dev.craftium'
base { archivesName = 'craftium-server' }

repositories { mavenCentral() }
configurations { embedded }
configurations.implementation.extendsFrom(configurations.embedded)

dependencies {
    paperweight.paperDevBundle(paperDevBundle)
    embedded 'org.luaj:luaj-jse:3.0.1'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def sharedPlugin = rootProject.file('server-plugin/src')
def own = layout.projectDirectory.dir('src')

sourceSets.main {
    java {
        setSrcDirs([sharedPlugin.toPath().resolve('main/java').toFile(), rootProject.file('src/main/java'), rootProject.file("versions/${minecraftVersion}/src/main/java")])
        // Fabric-only entry points and mixins do not belong in a Paper plugin.
        exclude 'dev/craftium/Craftium.java', 'dev/craftium/mixin/**', 'dev/craftium/compat/FabricCompat.java', 'dev/craftium/server/ServerCommands.java',
                'dev/craftium/server/Jigsaw*.java' // the jigsaw tools are registered by ServerCommands, so nothing on Paper reaches them, and they use Fabric's tick events
    }
    resources.srcDirs = [sharedPlugin.toPath().resolve('main/resources').toFile(), own.dir('main/resources').asFile]
}
sourceSets.test.java.srcDirs = [sharedPlugin.toPath().resolve('test/java').toFile()]
sourceSets {
    liveTest {
        java.srcDirs = [sharedPlugin.toPath().resolve('liveTest/java').toFile()]
        resources.srcDirs = [own.dir('liveTest/resources').asFile]
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}
tasks.register('liveTestPluginJar', Jar) {
    dependsOn tasks.named('liveTestClasses')
    archiveFileName = 'craftium-test-fixture.jar'
    from sourceSets.liveTest.output
}
tasks.withType(JavaCompile).configureEach { options.release = pluginJava }
java { sourceCompatibility = JavaVersion.toVersion(pluginJava); targetCompatibility = JavaVersion.toVersion(pluginJava); withSourcesJar() }
test { useJUnitPlatform() }
processResources {
    inputs.property 'version', project.version
    filesMatching('plugin.yml') { expand version: project.version }
    from(rootProject.file('src/main/resources/assets/craftium/icon.png')) { into 'assets/craftium' }
    from(rootProject.file('branding/craftium.svg')) { into 'assets/craftium' }
    from(rootProject.file('src/main/resources/assets/craftium/bedrock_blocks.txt.gz')) { into 'assets/craftium' }
}
jar {
    from({ configurations.embedded.collect { zipTree(it) } })
    from(rootProject.file('LICENSE')) { rename { 'LICENSE_Craftium' } }
    from(rootProject.file('THIRD-PARTY-NOTICES.md'))
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes 'paperweight-mappings-namespace': 'mojang' }
}

// Paperweight also contributes a source root; retain one copy of shared sources.
tasks.named('sourcesJar') { duplicatesStrategy = DuplicatesStrategy.EXCLUDE }
