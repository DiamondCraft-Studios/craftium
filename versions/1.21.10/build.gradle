plugins {
    id 'net.fabricmc.fabric-loom-remap'
}

version = "${rootProject.mod_version}+mc${minecraft_version}"
group = rootProject.maven_group
base { archivesName = rootProject.archives_base_name }

repositories { mavenCentral() }

// Shared sources live in the repository root. A file under this module's own src/ replaces the
// shared file with the same relative path, so version differences are explicit overrides.
// The merged tree is assembled into build/merged and compiled from there.
def merged = layout.buildDirectory.dir('merged')

def mergeTask = { String name, String set ->
    tasks.register(name, Sync) {
        into merged.map { it.dir(set) }
        duplicatesStrategy = DuplicatesStrategy.INCLUDE // later sources win
        from rootProject.file("src/${set}")
        from layout.projectDirectory.dir("src/${set}")
    }
}
def mergeMain = mergeTask('mergeMainSources', 'main')
def mergeClient = mergeTask('mergeClientSources', 'client')

loom {
    splitEnvironmentSourceSets()
    mods {
        craftium {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

sourceSets {
    main {
        java.srcDirs = [merged.map { it.dir('main/java') }]
        resources.srcDirs = [merged.map { it.dir('main/resources') }]
    }
    client {
        java.srcDirs = [merged.map { it.dir('client/java') }]
    }
}
tasks.named('compileJava') { dependsOn mergeMain }
tasks.named('processResources') { dependsOn mergeMain }
tasks.named('compileClientJava') { dependsOn mergeClient }
tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn mergeMain, mergeClient }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation 'org.luaj:luaj-jse:3.0.1'
    include 'org.luaj:luaj-jse:3.0.1'
}

processResources {
    from(rootProject.file('branding/craftium.svg')) { into 'assets/craftium' }
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach { options.release = 21; options.compilerArgs << '-Xmaxerrs' << '2000' }
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from(rootProject.file('LICENSE')) { rename { 'LICENSE_Craftium' } }
    from(rootProject.file('THIRD-PARTY-NOTICES.md'))
}
