name: Build craftium-mcp

# Tests the MCP server and packs it as craftium.mcpb, the extension Claude Desktop installs.
on:
  push:
    branches: [main]
    paths:
      - 'mcp/**'
      - 'branding/craftium.png'
      - '.github/workflows/build-mcp.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mcp/**'
      - 'branding/craftium.png'
      - '.github/workflows/build-mcp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Show the preinstalled Node
        run: node --version && npm --version

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Pack the extension
        run: npx --yes @anthropic-ai/mcpb@2.1.2 pack . craftium.mcpb

      - name: Upload the extension
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: craftium-mcpb
          path: mcp/craftium.mcpb
          if-no-files-found: error
