name: Build craftium-mcp

# Tests the MCP server, which ships as the Claude plugin in mcp/.
on:
  push:
    branches: [main]
    paths:
      - 'mcp/**'
      - 'branding/craftium.png'
      - '.github/workflows/build-mcp.yml'
  pull_request:
    types: [opened, reopened]
    branches: [main]
    paths:
      - 'mcp/**'
      - 'branding/craftium.png'
      - '.github/workflows/build-mcp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Show the preinstalled Node
        run: node --version && npm --version

      - name: Install
        run: npm ci

      - name: Test
        run: npm test
