name: Build one version

# Reusable job shared by build-26.2.yml and build-1.21.10.yml.
on:
  workflow_call:
    inputs:
      tasks:
        description: Gradle tasks to run
        type: string
        required: true
      jars:
        description: Paths of the JARs to upload, one per line
        type: string
        required: true
      reports:
        description: Paths of the test reports to upload, one per line
        type: string
        required: true
      artifact:
        description: Name prefix for the uploaded artifacts
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
        with:
          cache-provider: basic

      - name: Build, run unit tests, compile game tests
        run: ./gradlew ${{ inputs.tasks }} --no-daemon

      - name: Upload JARs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.artifact }}-jars
          path: ${{ inputs.jars }}
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.artifact }}-test-reports
          path: ${{ inputs.reports }}
          if-no-files-found: warn
