name: Build Craftium 26.2

# Runs when shared code or anything 26.2 owns changes. Branches: main and the 26.2 release branch.
on:
  push:
    branches: [main, release/26.2]
    paths:
      - 'src/**'
      - 'versions/26.2/**'
      - 'server-plugin/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'branding/**'
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES.md'
      - '.github/workflows/build-26.2.yml'
      - '.github/workflows/build-version.yml'
  pull_request:
    branches: [main, release/26.2]
    paths:
      - 'src/**'
      - 'versions/26.2/**'
      - 'server-plugin/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'branding/**'
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES.md'
      - '.github/workflows/build-26.2.yml'
      - '.github/workflows/build-version.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-26.2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-version.yml
    with:
      artifact: craftium-26.2
      tasks: ':versions:mc-26.2:build :server-plugin:build :versions:mc-26.2:compileGametestJava'
      jars: |
        versions/26.2/build/libs/*.jar
        server-plugin/build/libs/*.jar
        !**/*-sources.jar
      reports: |
        versions/26.2/build/reports/tests/test/
        server-plugin/build/reports/tests/test/
